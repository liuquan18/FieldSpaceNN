dataset:
  _target_: fieldspacenn.src.data.datasets_icon.ICONLoader
  norm_dict: ${run_dir}/input/norm_dict.json
  p_dropout: 0
  random_p: false
  p_dropout_all: 1
  n_sample_variables: -1
  output_binary_mask: true
  apply_diff: true
  mask_ts_mode: 'zero'
  load_n_samples_time: 2
  # Reuse the same per-zoom grid file paths configured in `mgrids/icon.yaml`
  # so cell coordinates are resolved from the grid files (which carry
  # `clon`/`clat` or `lon_cell_centre`/`lat_cell_centre`) rather than from
  # the data files, which for real ICON output typically carry no
  # coordinate variables at all.
  grid_files: ${mgrids.grid_files}
  sampling_zooms:
    5:
      n_past_ts: 1
      n_future_ts: 1
      zoom_patch_sample: -1
      mask_n_last_ts: 1
    6:
      n_past_ts: 1
      n_future_ts: 1
      zoom_patch_sample: -1
      mask_n_last_ts: 1
  output_max_zoom_only: false
datamodule:
  _target_: fieldspacenn.src.data.pl_data_module.DataModule
  batch_size: 2
  num_workers: 0
  use_costum_ddp_sampler: false
