_target_: fieldspacenn.src.modules.grids.grid_utils.icon_grid_to_mgrid
# Mapping from zoom level to the corresponding ICON native grid file.
# Unlike Healpix, ICON refinement levels (R*B*) don't follow an analytic
# pixel-count formula, so every zoom level needs its own grid file
# (containing cell coordinates -- `clon`/`clat` or `lon_cell_centre`/
# `lat_cell_centre` -- and `neighbor_cell_index`).
# zoom = log4(ncells/5); R2B03 -> zoom 5 (5120 cells), R2B04 -> zoom 6 (20480 cells).
grid_files:
